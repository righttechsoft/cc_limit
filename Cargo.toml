[package]
name = "cc_limit"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cc_limit"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
serde_json = "1"
once_cell = "1"

[build-dependencies]
winres = "0.1"

[dependencies.winapi]
version = "0.3"
features = [
    "winuser",
    "wingdi",
    "libloaderapi",
    "winhttp",
    "winbase",
    "errhandlingapi",
    "synchapi",
    "processthreadsapi",
    "handleapi",
    "shellapi",
    "winnt",
    "minwindef",
    "windef",
    "winerror",
    "ntdef",
]
